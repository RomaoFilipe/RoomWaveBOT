<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">

  <!-- Importante para identificação do embed junto do YouTube -->
  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <title>RoomWave YouTube Player</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #player {
      width: 100%;
      height: calc(100% - 55px);
    }

    #status {
      height: 55px;
      box-sizing: border-box;
      padding: 10px 18px;
      background: #111;
      color: #0f0;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div id="player"></div>
<div id="status">RoomWave: a iniciar...</div>

<script>
const params = new URLSearchParams(location.search);
const videoId = params.get("v");

const statusEl = document.getElementById("status");

window.roomwaveState = {
  videoId,
  ready: false,
  state: "BOOTING",
  error: null
};

function updateStatus(text) {
  statusEl.textContent = text;
  window.roomwaveState.state = text;
}

if (!videoId || !/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
  updateStatus("ERRO: Video ID inválido");
  throw new Error("Invalid YouTube video ID");
}

const script = document.createElement("script");
script.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(script);

let player;

window.onYouTubeIframeAPIReady = function () {

  player = new YT.Player("player", {

    width: "1280",
    height: "720",

    videoId,

    playerVars: {
      autoplay: 1,
      controls: 1,
      playsinline: 1,

      enablejsapi: 1,

      origin: location.origin,

      loop: 1,
      playlist: videoId
    },

    events: {

      onReady: function (event) {

        window.roomwavePlayer = event.target;
        window.roomwaveState.ready = true;

        event.target.unMute();
        event.target.setVolume(100);

        updateStatus(
          "READY | " +
          videoId +
          " | origin=" +
          location.origin
        );

        event.target.playVideo();
      },

      onStateChange: function (event) {

        const states = {
          "-1": "UNSTARTED",
          "0": "ENDED",
          "1": "PLAYING",
          "2": "PAUSED",
          "3": "BUFFERING",
          "5": "CUED"
        };

        const name = states[event.data] ?? String(event.data);

        window.roomwaveState.playerState = event.data;

        updateStatus(
          name +
          " | " +
          videoId
        );
      },

      onError: function (event) {

        window.roomwaveState.error = event.data;

        updateStatus(
          "YOUTUBE ERROR " +
          event.data +
          " | " +
          videoId
        );
      },

      onAutoplayBlocked: function () {

        window.roomwaveState.autoplayBlocked = true;

        updateStatus(
          "AUTOPLAY BLOCKED | " +
          videoId
        );
      }
    }
  });
};
</script>

</body>
</html>
